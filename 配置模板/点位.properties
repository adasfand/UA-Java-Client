# 这里仅配置标准服务器时间节点，用于首次读取验证，不是生产点表。
# 在本机配置中另建点位文件后，把客户端配置的 nodes.file 指向它。
nodes=serverTime
node.serverTime.namespaceUri=http://opcfoundation.org/UA/
node.serverTime.identifierType=i
node.serverTime.identifier=2258
node.serverTime.dataType=DateTime
node.serverTime.writable=false

