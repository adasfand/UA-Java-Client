# 文件按 UTF-8 读取。复制到“config/local/client.properties”后使用。
# 路径相对于本配置文件所在目录；IP、策略和用户名不写在 Java 源码中。
endpoint.url=opc.tcp://127.0.0.1:49320
security.policy=Basic256
security.mode=SignAndEncrypt
identity.type=username
identity.username=ua_test
identity.passwordEnv=UA_PASSWORD
application.uri=urn:buct:ua:local-development
application.name=OPC UA 本机开发客户端
request.timeoutMs=10000
pki.directory=../../pki
pki.passwordEnv=UA_KEYSTORE_PASSWORD
nodes.file=../templates/nodes.properties
# 首版写操作只用于本机模拟服务，必须同时满足总开关、点位白名单和命令确认。
environment=simulation
writes.enabled=false
